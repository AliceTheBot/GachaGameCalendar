<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>手游活动日历 · __DATE__</title>
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png?v=2" />
<link rel="shortcut icon" href="assets/favicon.png?v=2" />
<link rel="apple-touch-icon" href="assets/favicon.png?v=2" />
<style>
  :root{
    --bg:#0b0d12;
    --panel:#141822;
    --card:#171c27;
    --line:rgba(255,255,255,.09);
    --txt:#eef1f7;
    --dim:#98a0b3;
    --accent:#e8c37a;
    --radius:16px;
    --chip:rgba(255,255,255,.035);
    --chip2:rgba(255,255,255,.08);
    --desc:#c2c9d8;
    --shadow:0 18px 40px rgba(0,0,0,.4);
    --statebg:rgba(8,10,14,.72);
  }
  html[data-theme="light"]{
    --bg:#f3f5fa;
    --panel:#ffffff;
    --card:#ffffff;
    --line:rgba(18,24,40,.10);
    --txt:#151a24;
    --dim:#5d6579;
    --desc:#3c4457;
    --chip:rgba(18,24,40,.04);
    --chip2:rgba(18,24,40,.08);
    --shadow:0 16px 34px rgba(23,32,58,.12);
    --statebg:rgba(255,255,255,.86);
  }
  html[data-theme="light"] body{
    background:
      radial-gradient(900px 500px at 12% -8%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
      radial-gradient(900px 600px at 88% 0%, rgba(110,130,255,.10), transparent 60%),
      var(--bg);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 12% -8%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(900px 600px at 88% 0%, rgba(110,130,255,.14), transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:18px 22px 56px}

  header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:9px}
  .logo{
    width:30px;height:30px;border-radius:50%;flex:none;overflow:hidden;
    background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 35%, #6d7cff));
    display:grid;place-items:center;color:#12141a;font-weight:800;font-size:14px;
    box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 25%, transparent);
  }
  .logo img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s ease,transform .4s ease}
  h1{font-size:19px;line-height:1.15;margin:0;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:13px;margin-top:6px}
  .top-right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .pill{
    font-size:12px;color:var(--dim);border:1px solid var(--line);
    padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.03);
  }
  .pill b{color:var(--txt);font-weight:600}
  .theme-btn{
    width:30px;height:30px;flex:none;border-radius:50%;cursor:pointer;
    border:1px solid var(--line);background:var(--chip);color:var(--txt);
    display:grid;place-items:center;font-size:14px;line-height:1;padding:0;transition:.18s;
  }
  .theme-btn:hover{border-color:color-mix(in srgb,var(--accent) 55%, transparent);transform:rotate(-12deg)}

  nav.tabs{
    position:sticky;top:0;z-index:20;
    display:flex;flex-wrap:wrap;gap:8px;
    padding:9px;margin:4px 0 14px;
    background:color-mix(in srgb, var(--panel) 72%, transparent);
    border:1px solid var(--line);border-radius:16px;
    backdrop-filter:blur(14px) saturate(130%);
  }
  .tab{
    flex:none;cursor:pointer;border:1px solid var(--line);
    background:var(--chip);color:var(--dim);
    padding:9px 16px;border-radius:999px;font-size:14px;
    display:flex;align-items:center;gap:8px;transition:.18s;font-family:inherit;
  }
  .tab .n{
    font-size:11px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;
    display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--dim);
  }
  .tab:hover{color:var(--txt);border-color:rgba(255,255,255,.2)}
  .tab.on{
    background:var(--accent);border-color:var(--accent);color:#12141a;font-weight:600;
    box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 26%, transparent);
  }
  .tab.on .n{background:rgba(0,0,0,.18);color:#12141a}

  .swipe-hint{display:none;font-size:12px;color:#6f778a;margin:0 0 12px;letter-spacing:.5px}
  @media (pointer:coarse){ .swipe-hint{display:block} }

  .panel{display:none;animation:fade .25s ease}
  .panel.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .panel-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;margin:14px 0 18px}
  .panel-head h2{font-size:20px;margin:0}
  .ver{font-size:13px;color:var(--accent)}
  .note{font-size:12.5px;color:var(--dim);margin-left:auto}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;align-items:stretch}
  article.card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
    transition:transform .18s,border-color .18s,box-shadow .18s;
  }
  article.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 45%, transparent);
    box-shadow:var(--shadow)}
  .thumb{position:relative;background:#0e1017;line-height:0;aspect-ratio:16/9;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
  .thumb.contain img{object-fit:contain;background:var(--bg)}
  .state{
    position:absolute;left:12px;top:12px;font-size:11.5px;font-weight:600;
    padding:5px 10px;border-radius:999px;letter-spacing:.4px;
    background:var(--statebg);backdrop-filter:blur(6px);
    border:1px solid var(--line);color:var(--dim);
  }
  .state.live{color:#7dffb0;border-color:rgba(125,255,176,.35)}
  .state.soon{color:#ffd166;border-color:rgba(255,209,102,.38)}
  .state.done{color:#9aa2b4}
  .body{padding:15px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .body h3{font-size:17px;line-height:1.35;margin:0;letter-spacing:.2px}
  .range{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .desc{font-size:13px;color:var(--desc);line-height:1.6;margin:0}
  .foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .count{font-size:13px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
  .count small{font-size:11px;color:var(--dim);font-weight:400;margin-right:4px}
  .pct{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .bar{height:4px;border-radius:4px;background:var(--chip2);overflow:hidden;margin-top:2px}
  .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 45%, #8ea2ff))}

  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);padding:34px 20px;
    text-align:center;color:var(--dim);font-size:14px;background:var(--chip);
  }
  .empty b{color:var(--txt)}

  .soon-box{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px}
  .soon-box h4{margin:0 0 10px;font-size:13px;color:var(--dim);font-weight:600;letter-spacing:1px}
  .soon-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px}
  .soon-row:first-of-type{border-top:0}
  .soon-row .d{color:var(--accent);font-variant-numeric:tabular-nums;font-size:12.5px}
  .soon-row .t{font-weight:600}
  .soon-row .s{color:var(--dim);font-size:12px}

  details.fold{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--chip);padding:0 14px}
  details.fold summary{cursor:pointer;padding:12px 0;font-size:13px;color:var(--dim);list-style:none;user-select:none}
  details.fold summary::-webkit-details-marker{display:none}
  details.fold summary::before{content:"▸";display:inline-block;margin-right:8px;transition:.2s;color:var(--accent)}
  details.fold[open] summary::before{transform:rotate(90deg)}
  details.fold .rows{padding:2px 0 10px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:7px 0;font-size:13px;border-top:1px dashed var(--line)}
  .row .mini{width:62px;height:40px;object-fit:cover;border-radius:6px;flex:none;border:1px solid var(--line);background:var(--chip2)}
  .row .n{font-weight:500}
  .row .time{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  .row .why{color:#7f889c;font-size:11.5px;margin-left:auto}

  .pool-wrap{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .pool{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    border:1px solid color-mix(in srgb,var(--accent) 30%, var(--line));
    border-radius:14px;padding:12px 16px;
    background:linear-gradient(100deg, color-mix(in srgb,var(--accent) 11%, var(--card)), var(--card) 60%);
  }
  .pool.soon{border-style:dashed;background:var(--card)}
  .pool-tag{
    font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--accent);flex:none;
    border:1px solid color-mix(in srgb,var(--accent) 45%, transparent);
    padding:3px 9px;border-radius:999px;
  }
  .pool-chars{display:flex;gap:8px;flex-wrap:wrap}
  .pool-chars b{font-size:15px;letter-spacing:.3px}
  .pool-sub{font-size:12.5px;color:var(--dim);flex:1 1 260px;min-width:200px;line-height:1.5}
  .pool-time{font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
  .pool-time small{color:var(--dim);margin-right:5px;font-size:11px}

  footer.src{margin-top:34px;color:#6f778a;font-size:12px;line-height:1.8}
  footer.src a{color:#8b93a8}
  .foot-date{display:none;color:#6f778a;margin-bottom:6px}

  @media (max-width:640px){
    .wrap{padding:14px 14px 44px}
    h1{font-size:17px}
    .top-right{gap:6px}
    .top-right .pill{display:none}
    .foot-date{display:block}
    .grid{grid-template-columns:1fr}
    .note{margin-left:0}
    .tab{padding:7px 12px;font-size:13px}
    nav.tabs{gap:6px;padding:8px 0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><img id="logoImg" alt="" src="assets/logo-genshin.webp" /></div>
      <div>
        <h1>手游活动日历</h1>
      </div>
    </div>
    <div class="top-right">
      <div class="pill">更新于 <b>__DATE__</b></div>
      <div class="pill" id="statPill">统计中…</div>
      <button class="theme-btn" id="themeBtn" type="button" title="切换明暗主题" aria-label="切换明暗主题">☾</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div class="swipe-hint">← 左右滑动 / 方向键切换游戏 →</div>
  <main id="panels"></main>

  <footer class="src">
    <div class="foot-date">（更新于 __DATE__）</div>
    说明：时间均为游戏服务器时间（UTC+8）。活动配图取自各游戏 B 站官方动态；活动时间以官方动态与版本公告为准。<br />
    榜单由本地页面生成，剩余时间按当前系统时间实时计算。
  </footer>
</div>

<script>
const DATA = __DATA__;

const $ = (s,el=document)=>el.querySelector(s);

// 左上角图标：跟随当前选中的游戏
function setLogo(id){
  const img=document.getElementById("logoImg"); if(!img) return;
  const g=DATA.find(x=>x.id===id); if(!g||!g.logo) return;
  if(img.getAttribute("src")===g.logo) return;
  img.style.opacity="0";
  img.style.transform="scale(.82)";
  setTimeout(()=>{ img.src=g.logo; img.style.opacity="1"; img.style.transform="scale(1)"; },160);
}

const pad = n=>String(n).padStart(2,"0");
function fmtRange(ev){
  const f = iso=>{const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
  return `${ev.st || f(ev.s)} – ${f(ev.e)}`;
}
function remain(ms){
  if(ms<=0) return "已结束";
  const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), sec=s%60;
  if(d>0) return `${d} 天 ${pad(h)}:${pad(m)}:${pad(sec)}`;
  if(h>0) return `${h}:${pad(m)}:${pad(sec)}`;
  return `${m}:${pad(sec)}`;
}
let current = DATA[0].id;

function card(ev){
  const now=Date.now(), s=new Date(ev.s).getTime(), e=new Date(ev.e).getTime();
  const live = now>=s && now<e, soon = now<s;
  const cls = live?"live":soon?"soon":"done";
  const label = live?"进行中":soon?"即将开始":"已结束";
  const total=e-s, pct=Math.min(100,Math.max(0,(now-s)/total*100));
  return `<article class="card" data-s="${s}" data-e="${e}">
    <div class="thumb${ev.fit==="contain"?" contain":""}"><img src="${ev.img}" alt="${ev.t}" loading="lazy"${ev.pos?` style="object-position:${ev.pos}"`:""}>
      <span class="state ${cls}">${label}</span></div>
    <div class="body">
      <h3>${ev.t}</h3>
      <div class="range">${fmtRange(ev)}</div>
      <p class="desc">${ev.d||""}</p>
      <div class="foot">
        <span class="count" data-count="${live?"end":"start"}" data-t="${live?e:s}">${live?"剩余":"距开始"} —</span>
        <span class="pct">${live?Math.round(pct)+"%":""}</span>
      </div>
      <div class="bar"><i style="width:${live?pct:0}%"></i></div>
    </div>
  </article>`;
}

function poolRow(p){
  const now=Date.now(), s=+new Date(p.s), e=+new Date(p.e);
  const soon=now<s;
  return `<div class="pool${soon?" soon":""}">
    <span class="pool-tag">${soon?"即将开启":"当前卡池"}</span>
    <span class="pool-chars">${p.chars.map(c=>`<b>${c}</b>`).join("")}</span>
    <span class="pool-sub">${p.pool}</span>
    <span class="pool-time" data-count="${soon?"start":"end"}" data-t="${soon?s:e}"></span>
  </div>`;
}

function render(){
  const tabs=$("#tabs"), panels=$("#panels");
  tabs.innerHTML = DATA.map(g=>{
    const n=g.events.filter(ev=>Date.now()<new Date(ev.e).getTime()).length;
    return `<button class="tab${g.id===current?" on":""}" data-id="${g.id}" style="--accent:${g.accent}">
      ${g.name}<span class="n">${n}</span></button>`;
  }).join("");

  panels.innerHTML = DATA.map(g=>{
    const now=Date.now();
    const live=g.events.filter(ev=>now>=new Date(ev.s)&&now<new Date(ev.e));
    const soon=g.events.filter(ev=>now<new Date(ev.s));
    const ended=g.events.filter(ev=>now>=new Date(ev.e));
    const cards=[...live,...soon].map(card).join("");
    const empty=cards?"":`<div class="empty">这个版本暂时没有正在进行/即将开始的<b>短期限时活动</b>。<br>持续整版本的活动已按规则折叠在下方。</div>`;
    const soonRows=(g.soon||[]).map(x=>`<div class="soon-row"><span class="d">${x.d}</span><span class="t">${x.t}</span><span class="s">${x.s}</span></div>`).join("");
    const folded=(g.folded||[]).map(x=>`<div class="row">${x.img?`<img class="mini" src="${x.img}" alt="" loading="lazy">`:""}<span class="n">${x.n}</span><span class="time">${x.time}</span><span class="why">${x.why}</span></div>`).join("");
    const endedRows=(g.ended||[]).map(x=>`<div class="row">${x.img?`<img class="mini" src="${x.img}" alt="" loading="lazy">`:""}<span class="n">${x.n}</span><span class="time">${x.time}</span></div>`).join("");
    return `<section class="panel${g.id===current?" on":""}" data-id="${g.id}" style="--accent:${g.accent}">
      <div class="panel-head">
        <h2>${g.name}</h2><span class="ver">${g.version}</span>
        <span class="note">${live.length} 个进行中${soon.length?` · ${soon.length} 个即将开始`:""}</span>
      </div>
      ${empty}
      <div class="grid">${cards}</div>
      ${(g.pools&&g.pools.length)?`<div class="pool-wrap">${g.pools.map(poolRow).join("")}</div>`:""}
      ${soonRows?`<div class="soon-box"><h4>其他即将开始 / 待官宣</h4>${soonRows}</div>`:""}
      ${folded?`<details class="fold"><summary>持续整版本的活动（共 ${(g.folded||[]).length} 个）</summary><div class="rows">${folded}</div></details>`:""}
      ${endedRows?`<details class="fold"><summary>近期已结束（共 ${(g.ended||[]).length} 个）</summary><div class="rows">${endedRows}</div></details>`:""}
    </section>`;
  }).join("");

  const totalLive=DATA.reduce((a,g)=>{
    const now=Date.now();
    return a+g.events.filter(ev=>now>=new Date(ev.s)&&now<new Date(ev.e)).length;
  },0);
  const totalSoon=DATA.reduce((a,g)=>{
    const now=Date.now();
    return a+g.events.filter(ev=>now<new Date(ev.s)).length;
  },0);
  $("#statPill").innerHTML=`<b>${totalLive}</b> 个进行中 · <b>${totalSoon}</b> 个即将开始`;
}

function tick(){
  document.querySelectorAll("[data-count]").forEach(el=>{
    const t=+el.dataset.t, ms=t-Date.now();
    el.innerHTML = `<small>${el.dataset.count==="end"?"剩余":"距开始"}</small>${remain(Math.max(0,ms))}`;
  });
  document.querySelectorAll(".card").forEach(c=>{
    const now=Date.now(), s=+c.dataset.s, e=+c.dataset.e;
    const i=$(".bar i",c); if(!i) return;
    const pct=Math.min(100,Math.max(0,(now-s)/(e-s)*100));
    i.style.width=pct+"%";
    const p=$(".pct",c); if(p&&now<s) p.textContent="";
  });
}

function selectGame(id, scroll=true){
  if(!DATA.some(g=>g.id===id)) return;
  current=id;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.id===current));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.dataset.id===current));
  document.documentElement.style.setProperty("--accent",DATA.find(g=>g.id===current).accent);
  setLogo(current);
  const onTab=document.querySelector(`.tab[data-id="${current}"]`);
  if(onTab) onTab.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  if(scroll) window.scrollTo({top:0,behavior:"smooth"});
  // 记住当前标签：刷新、从分享链接打开都回到同一个游戏
  try{ localStorage.setItem("cal.tab", current); }catch(e){}
  if(location.hash !== "#"+current) history.replaceState(null,"","#"+current);
}

function step(dir){
  const i=DATA.findIndex(g=>g.id===current);
  selectGame(DATA[(i+dir+DATA.length)%DATA.length].id);
}

$("#tabs").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b) return;
  selectGame(b.dataset.id);
});

// 左右滑动切换（仅在横向位移明显大于纵向时触发，避免影响上下滚动）
let tx=0,ty=0,ts=0,inTabs=false;
document.addEventListener("touchstart",e=>{
  if(e.touches.length!==1){ tx=ty=0; return; }
  const t=e.touches[0];
  tx=t.clientX; ty=t.clientY; ts=Date.now();
  inTabs=!!e.target.closest("nav.tabs");
},{passive:true});
document.addEventListener("touchend",e=>{
  if(!tx||inTabs) return;
  const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  tx=ty=0;
  if(Date.now()-ts>800) return;
  if(Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.6) return;
  step(dx<0?1:-1);
},{passive:true});

document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") step(1);
  else if(e.key==="ArrowLeft") step(-1);
});

const themeBtn=document.getElementById("themeBtn");
function setTheme(t){
  document.documentElement.dataset.theme=t;
  if(themeBtn) themeBtn.textContent = t==="light" ? "☀" : "☾";
  try{ localStorage.setItem("cal.theme", t); }catch(e){}
}
(function initTheme(){
  let t="";
  try{ t=localStorage.getItem("cal.theme")||""; }catch(e){}
  if(!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  setTheme(t);
})();
if(themeBtn) themeBtn.addEventListener("click",()=>{
  setTheme(document.documentElement.dataset.theme==="light"?"dark":"light");
});

document.documentElement.style.setProperty("--accent",DATA[0].accent);
render(); tick();
setInterval(tick,1000);

// 恢复上次停留的游戏：优先 URL 里的 #id，其次 localStorage
(function restoreTab(){
  let want="";
  try{ want = location.hash.slice(1) || localStorage.getItem("cal.tab") || ""; }catch(e){}
  if(want && DATA.some(g=>g.id===want)) selectGame(want,false);
  else selectGame(DATA[0].id,false);
})();
</script>
